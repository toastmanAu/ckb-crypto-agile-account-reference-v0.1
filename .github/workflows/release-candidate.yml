name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version for the archive
        required: true
        default: v0.1.0-rc.2

permissions:
  contents: read

jobs:
  package:
    name: Reproducible RISC-V package
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pinned Rust target
        run: rustup target add riscv64imac-unknown-none-elf

      - name: Restore Cargo caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'ckb-contract.ld') }}
          restore-keys: |
            ${{ runner.os }}-release-
            ${{ runner.os }}-cargo-

      - name: Package release candidate
        run: ./scripts/package_release.sh "${{ inputs.version }}" "$RUNNER_TEMP/release"

      - name: Show package identities
        run: |
          cat "$RUNNER_TEMP"/release/*.sha256
          cat "$RUNNER_TEMP"/release/*/CKB_DATA_HASHES.json

      - name: Upload release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ckb-crypto-agile-account-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.sha256
          if-no-files-found: error
          retention-days: 30
