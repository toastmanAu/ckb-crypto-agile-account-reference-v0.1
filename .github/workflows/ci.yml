name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CKB_DEBUGGER_VERSION: v1.1.1
  CKB_DEBUGGER_SHA256: 0dee02804af46386527c8bb94c2ee63592594ca1ec952ea42ffa9df07a9f005e

jobs:
  validate:
    name: Rust, CKB-VM, and debugger
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install Rust components and RISC-V target
        run: |
          rustup show
          rustup component add rustfmt clippy
          rustup target add riscv64imac-unknown-none-elf

      - name: Restore Cargo caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml', 'ckb-contract.ld') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint host workspace
        run: |
          cargo clippy --locked --workspace --all-targets \
            --exclude account-lock \
            --exclude verifier-fixture \
            --exclude verifier-p256 \
            --exclude verifier-mldsa-adapter \
            --exclude verifier-slhdsa-adapter \
            -- -D warnings

      - name: Lint RISC-V contracts
        run: |
          cargo clippy --locked --release --target riscv64imac-unknown-none-elf \
            -p account-lock \
            -p verifier-fixture \
            -p verifier-p256 \
            -p verifier-mldsa-adapter \
            -p verifier-slhdsa-adapter \
            -- -D warnings

      - name: Build optimized RISC-V contracts
        run: |
          cargo build --locked --release --target riscv64imac-unknown-none-elf \
            -p account-lock \
            -p verifier-fixture \
            -p verifier-p256 \
            -p verifier-mldsa-adapter \
            -p verifier-slhdsa-adapter

      - name: Run unit and CKB-VM tests
        run: |
          cargo test --locked -p ckb-account-protocol -p ckb-account-host -p ckb-account-tests \
            -- --nocapture

      - name: Reproduce conformance vector
        run: |
          cargo run --locked -p ckb-account-host --example export_vectors -- /tmp/conformance-v1.bin
          cmp vectors/conformance-v1.bin /tmp/conformance-v1.bin

      - name: Install pinned ckb-debugger
        run: |
          archive=/tmp/ckb-debugger.tar.gz
          url="https://github.com/nervosnetwork/ckb-standalone-debugger/releases/download/${CKB_DEBUGGER_VERSION}/ckb-debugger_${CKB_DEBUGGER_VERSION}_x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 "$url" --output "$archive"
          echo "${CKB_DEBUGGER_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory /tmp ckb-debugger
          install -m 0755 /tmp/ckb-debugger "$HOME/.cargo/bin/ckb-debugger"
          ckb-debugger --version

      - name: Replay debugger vector
        run: |
          ckb-debugger --mode full \
            --tx-file vectors/fixture-spend.json \
            --script input.0.lock \
            --max-cycles 500000000

      - name: Ensure tests left the repository clean
        run: git diff --exit-code
